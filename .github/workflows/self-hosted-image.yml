name: Self-hosted image

on:
    workflow_dispatch:
        inputs:
            version:
                description: 'Version to publish, like 1.0.0 (no v)'
                required: true
                type: string
    push:
        tags:
            - 'v*'

permissions: {}

concurrency:
    group: self-hosted-image-${{ github.ref }}
    cancel-in-progress: false

jobs:
    image:
        name: Build and push ghcr.io/serveroshq/panel
        runs-on: ubuntu-latest
        timeout-minutes: 180
        environment: self-hosted-image
        permissions:
            contents: read
            packages: write
        steps:
            - name: Work out the version
              id: version
              env:
                  INPUT_VERSION: ${{ inputs.version }}
                  REF_NAME: ${{ github.ref_name }}
                  EVENT_NAME: ${{ github.event_name }}
              run: |
                  if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
                      version="$INPUT_VERSION"
                  else
                      version="${REF_NAME#v}"
                  fi
                  if ! printf '%s' "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$'; then
                      echo "::error::Not a version like 1.0.0 or 1.0.0-rc.1: $version"
                      exit 1
                  fi
                  tags="ghcr.io/serveroshq/panel:$version"
                  case "$version" in
                      *-*) ;;
                      *) tags="$tags,ghcr.io/serveroshq/panel:latest" ;;
                  esac
                  {
                      echo "version=$version"
                      echo "tags=$tags"
                      echo "created=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
                  } >> "$GITHUB_OUTPUT"

            - name: Checkout code
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false

            - name: Add panel-ee to the lock
              env:
                  COMPOSER_AUTH: ${{ secrets.COMPOSER_AUTH }}
              run: |
                  if [ -z "$COMPOSER_AUTH" ]; then
                      echo "::error::COMPOSER_AUTH isn't set in the self-hosted-image environment, so panel-ee can't be added."
                      exit 1
                  fi
                  composer config repositories.panel-ee vcs https://github.com/serveroshq/panel-ee
                  composer require --no-update serveroshq/panel-ee:dev-main
                  composer update serveroshq/panel-ee --no-install --no-scripts --ignore-platform-reqs --no-interaction

            - name: Set up QEMU
              uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

            - name: Set up Buildx
              uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

            - name: Log in to ghcr.io
              uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
              with:
                  registry: ghcr.io
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            - name: Build and push
              uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
              env:
                  COMPOSER_AUTH: ${{ secrets.COMPOSER_AUTH }}
              with:
                  context: .
                  file: docker/self-hosted/Dockerfile
                  platforms: linux/amd64,linux/arm64
                  push: true
                  secret-envs: composer_auth=COMPOSER_AUTH
                  build-args: SERVEROS_VERSION=${{ steps.version.outputs.version }}
                  tags: ${{ steps.version.outputs.tags }}
                  provenance: false
                  labels: |
                      org.opencontainers.image.title=ServerOS panel
                      org.opencontainers.image.description=The ServerOS panel for your own server. Contains the commercial serveroshq/panel-ee package, off until a license key is added.
                      org.opencontainers.image.url=https://serveros.com
                      org.opencontainers.image.source=https://github.com/serveroshq/panel
                      org.opencontainers.image.documentation=https://github.com/serveroshq/panel/blob/main/docs/self-hosting.md
                      org.opencontainers.image.vendor=ServerOS Cloud Ltd
                      org.opencontainers.image.version=${{ steps.version.outputs.version }}
                      org.opencontainers.image.created=${{ steps.version.outputs.created }}
                      org.opencontainers.image.revision=${{ github.sha }}
                      org.opencontainers.image.licenses=AGPL-3.0-only AND LicenseRef-ServerOS-Commercial
                      com.serveros.edition=official
                      com.serveros.license-note=The panel is AGPL-3.0-only (source at github.com/serveroshq/panel). This image also contains serveroshq/panel-ee under the ServerOS Commercial License (vendor/serveroshq/panel-ee/LICENSE).
